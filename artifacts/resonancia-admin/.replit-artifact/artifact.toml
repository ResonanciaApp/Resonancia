kind = "web"
previewPath = "/admin/"
title = "RESONANCIA — Admin"
version = "1.0.0"
id = "artifacts/resonancia-admin"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/admin/" ]
localPort = 18161

[services.development]
run = "pnpm --filter @workspace/resonancia-admin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/resonancia-admin", "run", "build" ]
publicDir = "artifacts/resonancia-admin/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18161"
BASE_PATH = "/admin/"

openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: messages
    description: Anonymous community messages
  - name: users
    description: User profiles
  - name: friends
    description: Friendships and friend requests
  - name: notifications
    description: User notifications
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /messages:
    get:
      operationId: getMessages
      tags: [messages]
      summary: Get anonymous messages
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: Paginated list of messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagesPage"
    post:
      operationId: createMessage
      tags: [messages]
      summary: Post an anonymous message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageBody"
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityMessage"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /messages/top:
    get:
      operationId: getTopMessage
      tags: [messages]
      summary: Get today's top message by likes
      responses:
        "200":
          description: Top message or null if none exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopMessageResponse"
  /me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get the current user's profile (auto-creates on first call)
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update the current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/search:
    get:
      operationId: searchUsers
      tags: [users]
      summary: Search users by username or display name
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Matching users with friendship status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSearchResult"
  /friends:
    get:
      operationId: getFriends
      tags: [friends]
      summary: List accepted friends
      responses:
        "200":
          description: Friends list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"
  /friends/{userId}:
    delete:
      operationId: removeFriend
      tags: [friends]
      summary: Remove a friend (or cancel a pending request involving the user)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /friend-requests:
    get:
      operationId: getFriendRequests
      tags: [friends]
      summary: List incoming pending friend requests
      responses:
        "200":
          description: Incoming requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FriendRequest"
    post:
      operationId: sendFriendRequest
      tags: [friends]
      summary: Send a friend request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendRequestInput"
      responses:
        "201":
          description: Request sent (or accepted, if there was a matching incoming request)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequest"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Target user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already friends or request already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /friend-requests/{id}/accept:
    post:
      operationId: acceptFriendRequest
      tags: [friends]
      summary: Accept an incoming friend request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequest"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /friend-requests/{id}/decline:
    post:
      operationId: declineFriendRequest
      tags: [friends]
      summary: Decline an incoming friend request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Declined
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: List the current user's notifications (newest first)
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      tags: [notifications]
      summary: Number of unread notifications
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "204":
          description: Marked as read
  /messages/{id}/like:
    post:
      operationId: likeMessage
      tags: [messages]
      summary: Like a message
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated like count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CommunityMessage:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        likes:
          type: integer
      required: [id, content, createdAt, likes]
    MessagesPage:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/CommunityMessage"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
      required: [messages, total, page, pageSize]
    CreateMessageBody:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 300
      required: [content]
    TopMessageResponse:
      type: object
      properties:
        message:
          oneOf:
            - $ref: "#/components/schemas/CommunityMessage"
            - type: "null"
      required: [message]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    UserProfile:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: ["string", "null"]
      required: [id, username, displayName]
    UserProfileUpdate:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 24
          pattern: "^[a-zA-Z0-9_]+$"
        displayName:
          type: string
          minLength: 1
          maxLength: 60
        avatarUrl:
          type: ["string", "null"]
    UserSearchResult:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: ["string", "null"]
        friendshipStatus:
          type: string
          enum: ["none", "pending_outgoing", "pending_incoming", "accepted", "self"]
      required: [id, username, displayName, friendshipStatus]
    FriendRequest:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          enum: ["pending", "accepted"]
        createdAt:
          type: string
          format: date-time
        requester:
          $ref: "#/components/schemas/UserProfile"
        addressee:
          $ref: "#/components/schemas/UserProfile"
      required: [id, status, createdAt, requester, addressee]
    FriendRequestInput:
      type: object
      properties:
        addresseeId:
          type: integer
      required: [addresseeId]
    Notification:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: ["friend_request", "friend_accepted"]
        createdAt:
          type: string
          format: date-time
        readAt:
          type: ["string", "null"]
          format: date-time
        actor:
          $ref: "#/components/schemas/UserProfile"
      required: [id, type, createdAt, readAt, actor]
    UnreadCount:
      type: object
      properties:
        count:
          type: integer
      required: [count]

          description: No autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateAdminGeometrix
      tags: [admin]
      summary: Guardar configuración de geometrías (bulk upsert, admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/GeometrixSettingUpdate"
      responses:
        "200":
          description: Configuración guardada
          content:
            application/json:
              schema:
                type: object
                required: [geometries]
                properties:
                  geometries:
                    type: array
                    items:
                      $ref: "#/components/schemas/GeometrixSettingItem"
        "400":
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /geometrix/settings:
    get:
      operationId: getGeometrixSettings
      tags: [geometrix]
      summary: Configuración pública de geometrías (para la app móvil)
      responses:
        "200":
          description: Lista de geometrías con ajustes
          content:
            application/json:
              schema:
                type: object
                required: [geometries]
                properties:
                  geometries:
                    type: array
                    items:
                      $ref: "#/components/schemas/GeometrixSettingItem"

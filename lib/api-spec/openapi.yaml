components:
  schemas:
    GrowthReward:
      type: object
      required: [id, enabled, text, amount]
      properties:
        id: { type: string, minLength: 1 }
        enabled: { type: boolean }
        text: { type: string, maxLength: 240 }
        amount: { type: integer, minimum: 1, maximum: 1000000 }
    GrowthStage:
      type: object
      required: [id, group, name, startDay, endDay, story, imageUrl, rewards]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        group: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 100 }
        startDay: { type: integer, minimum: 0, maximum: 1000000 }
        endDay: { type: integer, minimum: 0, maximum: 1000000 }
        story: { type: string, maxLength: 2000 }
        detailPhrase: { type: string, maxLength: 2000 }
        detailDescription: { type: string, maxLength: 10000 }
        imageUrl: { type: string, minLength: 1 }
        rewards:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/GrowthReward" }
    GrowthWorld:
      type: object
      required: [id, name, description, coverUrl]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
        coverUrl: { type: string, minLength: 1, maxLength: 2000 }
    GrowthCatalogInput:
      type: object
      required: [revision, stages]
      properties:
        revision: { type: integer, minimum: 1 }
        worlds:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/GrowthWorld" }
        stages:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/GrowthStage" }
    GrowthCatalog:
      type: object
      required: [revision, worlds, stages, updatedAt]
      properties:
        revision: { type: integer }
        updatedAt: { type: string }
        worlds:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/GrowthWorld" }
        stages:
          type: array
          items: { $ref: "#/components/schemas/GrowthStage" }
    GrowthIdentity:
      type: object
      required: [currentStage]
      properties:
        currentStage:
          anyOf:
            - { $ref: "#/components/schemas/GrowthStage" }
            - { type: "null" }
    GrowthProgress:
      type: object
      required: [ownerClerkUserId, totalActiveDays, balance, unlockedAvatarIds, reachedStageIds, currentStage, grantedRewards]
      properties:
        ownerClerkUserId: { type: string }
        totalActiveDays: { type: integer }
        balance: { type: integer }
        unlockedAvatarIds:
          type: array
          items: { type: string }
        reachedStageIds:
          type: array
          items: { type: string }
        grantedRewards:
          type: array
          items: { $ref: "#/components/schemas/GrowthGrant" }
        currentStage:
          anyOf:
            - { $ref: "#/components/schemas/GrowthStage" }
            - { type: "null" }
    GrowthAvatarInput:
      type: object
      required: [avatarId, expectedClerkUserId]
      properties:
        avatarId: { type: string, minLength: 1 }
        expectedClerkUserId: { type: string, minLength: 1 }
    GrowthGrant:
      type: object
      required: [rewardId, amount]
      properties:
        rewardId: { type: string }
        amount: { type: integer }
    CommunityPresenceSession:
      type: object
      required: [sessionId]
      properties:
        sessionId:
          type: string
          format: uuid
    CommunityPresenceSummary:
      type: object
      required: [count, updatedAt, avatars]
      properties:
        count:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
        avatars:
          type: array
          maxItems: 24
          items:
            type: object
            required: [id, avatarUrl, avatarPresetId]
            properties:
              id:
                type: string
              avatarUrl:
                type: [string, 'null']
              avatarPresetId:
                type: [string, 'null']
    ReflectionCategory:
      type: string
      pattern: "^[a-z][a-z0-9-]{0,39}$"
      maxLength: 40
    ReflectionIconOption:
      type: object

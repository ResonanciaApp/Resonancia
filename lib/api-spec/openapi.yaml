openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: messages
    description: Anonymous community messages
  - name: users
    description: User profiles
  - name: friends
    description: Friendships and friend requests
  - name: notifications
    description: User notifications
  - name: dm
    description: Direct messages between friends
  - name: storage
    description: File upload and serving
  - name: push
    description: Mobile push notification tokens
  - name: mixes
    description: Community-shared "Mi Música" mixes
  - name: catalog
    description: Catálogo de sesiones, categorías y audios
  - name: admin
    description: Panel de administración (solo rol admin)
  - name: mixer-sounds
    description: Sonidos del mixer Mi Música
  - name: glyphs
    description: Muro de la comunidad — composiciones Geometrix compartidas
  - name: live-sessions
    description: Sesiones en vivo con guiadores (Cal.com + Daily.co)
  - name: greeting
    description: Global greeting shown on Inicio
paths:
  /growth/catalog:
    get:
      operationId: getGrowthCatalog
      tags: [catalog]
      responses:
        "200":
          description: Configuración editorial de Tu camino
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrowthCatalog" }
  /admin/growth/catalog:
    put:
      operationId: saveGrowthCatalog
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrowthCatalogInput" }
      responses:
        "200":
          description: Configuración guardada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrowthCatalog" }
        "409": { description: La configuración cambió; recargar antes de guardar }
  /me/growth:
    get:
      operationId: getMyGrowth
      tags: [users]
      responses:
        "200":
          description: Progreso y saldo verificados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrowthProgress" }
  /me/growth/avatars/unlock:
    post:
      operationId: unlockGrowthAvatar
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrowthAvatarInput" }
      responses:
        "200":
          description: Avatar desbloqueado y saldo restante
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrowthProgress" }
        "409": { description: Saldo insuficiente }
  /users/{userId}/growth:
    get:
      operationId: getUserGrowth
      tags: [users]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Etapa pública del usuario visitado, sin saldo privado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrowthIdentity" }
  /community/presence:
    get:
      operationId: getCommunityPresence
      tags: [community-presence]
      summary: Active unique accounts and a bounded sample of shareable profile photos
      responses:
        '200':
          description: Foreground presence within the last 90 seconds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPresenceSummary'
        '401':
          description: Authentication required
        '503':
          description: Presence temporarily unavailable
  /community/presence/heartbeat:
    post:
      operationId: heartbeatCommunityPresence
      tags: [community-presence]
      summary: Renew this device foreground presence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityPresenceSession'
      responses:
        '204':
          description: Presence received
        '400':
          description: Invalid session identifier
        '401':
          description: Authentication required
  /community/presence/leave:
    post:
      operationId: leaveCommunityPresence
      tags: [community-presence]
      summary: Retire this foreground lease without removing other devices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityPresenceSession'
      responses:
        '204':
          description: Lease retired
        '400':
          description: Invalid session identifier
        '401':
          description: Authentication required
  /admin/profile-avatar-categories:
    post:
      operationId: createProfileAvatarCategory
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileAvatarCategoryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileAvatarCategory" }
  /admin/profile-avatar-categories/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    patch:
      operationId: updateProfileAvatarCategory
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileAvatarCategoryInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileAvatarCategory" }
    delete:
      operationId: deleteProfileAvatarCategory
      tags: [Admin]
      responses:
        "204": { description: Deleted }
  /admin/profile-avatar-memberships:
    put:
      operationId: updateProfileAvatarMemberships
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileAvatarMembershipInput" }
      responses:
        "200":
          description: Updated profile catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoverPresetList" }
  /cover-presets:
    get:
      operationId: listCoverPresets
      tags: [catalog]
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/CoverPresetScope"
      responses:
        "200":
          description: Ordered cover presets for a scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverPresetList"
        "400":
          description: Invalid scope
  /admin/cover-presets:
    get:
      operationId: listAdminCoverPresets
      tags: [admin]
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/CoverPresetScope"
      responses:
        "200":
          description: Ordered editable cover presets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverPresetList"
    post:
      operationId: createAdminCoverPreset
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoverPresetInput"
      responses:
        "201":
          description: Created cover preset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverPreset"
  /admin/cover-presets/order:
    put:
      operationId: reorderAdminCoverPresets
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoverPresetOrderInput"
      responses:
        "200":
          description: Reordered cover presets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverPresetList"
        "409":
          description: Catalog order changed since the supplied expected order
  /admin/cover-presets/upload:
    delete:
      operationId: cleanupAdminCoverPresetUpload
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoverPresetUploadCleanup"
      responses:
        "204":
          description: Unclaimed upload cleaned up
  /admin/cover-presets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateAdminCoverPreset
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoverPresetUpdate"
      responses:
        "200":
          description: Updated cover preset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverPreset"
    delete:
      operationId: deleteAdminCoverPreset
      tags: [admin]
      responses:
        "204":
          description: Deleted cover preset
  /inspirations/week:
    get:
      operationId: getInspirationWeek
      tags: [inspirations]
      parameters:
        - {name: date, in: query, schema: {type: string}}
        - {name: timeZone, in: query, schema: {type: string}}
      responses:
        "200": {description: Seven days, content: {application/json: {schema: {$ref: "#/components/schemas/InspirationWeek"}}}}
  /hero:
    get:
      operationId: getEffectiveHero
      tags: [inspirations]
      parameters:
        - {name: timeZone, in: query, schema: {type: string}}
      responses:
        "200": {description: Effective hero for the local day, content: {application/json: {schema: {$ref: "#/components/schemas/EffectiveHero"}}}}
  /hero/session-slides:
    get:
      operationId: getHeroSessionSlides
      tags: [inspirations]
      responses:
        "200": {description: Published session-backed Hero slides, content: {application/json: {schema: {$ref: "#/components/schemas/HeroSessionSlidesResponse"}}}}
  /admin/hero/session-slides:
    get:
      operationId: getAdminHeroSessionSlides
      tags: [admin]
      responses:
        "200": {description: Editable Hero session slides, content: {application/json: {schema: {$ref: "#/components/schemas/AdminHeroSessionSlides"}}}}
    put:
      operationId: updateAdminHeroSessionSlides
      tags: [admin]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/UpdateHeroSessionSlidesBody"}}}}
      responses:
        "200": {description: Updated Hero session slides, content: {application/json: {schema: {$ref: "#/components/schemas/AdminHeroSessionSlides"}}}}
  /admin/hero/destinations:
    get:
      operationId: listAdminHeroDestinations
      tags: [admin]
      responses:
        "200": {description: Published destinations available to Hero slides, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/HeroDestinationOptions"}}}}}
  /hero/session-slide-image/{position}:
    get:
      operationId: getHeroSessionSlideImage
      tags: [inspirations]
      parameters:
        - {name: position, in: path, required: true, schema: {type: integer, enum: [2, 3, 4]}}
        - {name: revision, in: query, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "200": {description: Published Hero slide image, content: {image/jpeg: {schema: {type: string, format: binary}}, image/png: {schema: {type: string, format: binary}}, image/webp: {schema: {type: string, format: binary}}}}
  /hero/media/{id}:
    get:
      operationId: getEffectiveHeroMedia
      tags: [inspirations]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: revision, in: query, required: true, schema: {type: integer, minimum: 1}}
        - {name: timeZone, in: query, required: true, schema: {type: string}}
        - {name: Range, in: header, schema: {type: string}}
      responses:
        "200": {description: Editorial hero media, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        "206": {description: Partial media response}
        "416": {description: Invalid or unsatisfiable range}
  /hero/poster/{id}:
    get:
      operationId: getEffectiveHeroPoster
      tags: [inspirations]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: revision, in: query, required: true, schema: {type: integer, minimum: 1}}
        - {name: timeZone, in: query, required: true, schema: {type: string}}
      responses:
        "200": {description: Effective hero poster, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
  /admin/heroes:
    get:
      operationId: listAdminHeroOverrides
      tags: [admin]
      responses:
        "200": {description: Editorial hero overrides, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/AdminHeroOverride"}}}}}
    post:
      operationId: upsertAdminHeroOverride
      tags: [admin]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/UpsertHeroOverrideBody"}}}}
      responses:
        "200": {description: Draft hero override, content: {application/json: {schema: {$ref: "#/components/schemas/AdminHeroOverride"}}}}
  /admin/heroes/uploads:
    post:
      operationId: requestHeroOverrideUpload
      tags: [admin]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/HeroOverrideUploadBody"}}}}
      responses:
        "200": {description: Upload URL, content: {application/json: {schema: {$ref: "#/components/schemas/InspirationUpload"}}}}
  /admin/heroes/asset:
    get:
      operationId: getAdminHeroOverrideAsset
      tags: [admin]
      parameters:
        - {name: objectPath, in: query, required: true, schema: {type: string}}
        - {name: Range, in: header, schema: {type: string}}
      responses:
        "200": {description: Draft hero asset, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        "206": {description: Partial draft hero asset}
        "416": {description: Invalid or unsatisfiable range}
  /admin/heroes/{id}:
    get:
      operationId: getAdminHeroOverride
      tags: [admin]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Hero override, content: {application/json: {schema: {$ref: "#/components/schemas/AdminHeroOverride"}}}}
    put:
      operationId: updateAdminHeroOverride
      tags: [admin]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/UpdateHeroOverrideBody"}}}}
      responses:
        "200": {description: Updated hero override, content: {application/json: {schema: {$ref: "#/components/schemas/AdminHeroOverride"}}}}
    delete:
      operationId: deleteAdminHeroOverride
      tags: [admin]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/InspirationRevisionBody"}}}}
      responses:
        "200": {description: Deleted hero override, content: {application/json: {schema: {$ref: "#/components/schemas/AdminHeroOverride"}}}}
  /admin/heroes/{id}/publish:
    post:
      operationId: publishAdminHeroOverride
      tags: [admin]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/InspirationRevisionBody"}}}}
      responses:
        "200": {description: Published hero override, content: {application/json: {schema: {$ref: "#/components/schemas/AdminHeroOverride"}}}}
  /admin/heroes/{id}/unpublish:
    post:
      operationId: unpublishAdminHeroOverride
      tags: [admin]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/InspirationRevisionBody"}}}}
      responses:
        "200": {description: Unpublished hero override, content: {application/json: {schema: {$ref: "#/components/schemas/AdminHeroOverride"}}}}
  /inspirations/settings:
    get:
      operationId: getInspirationSettings
      tags: [inspirations]
      responses:
        "200": {description: Editorial labels, content: {application/json: {schema: {$ref: "#/components/schemas/InspirationSettings"}}}}
  /inspirations/by-date/{date}:
    get:
      operationId: getInspirationByDate
      tags: [inspirations]
      parameters:
        - {name: date, in: path, required: true, schema: {type: string}}
        - {name: timeZone, in: query, schema: {type: string}}
      responses:
        "200": {description: Gated day, content: {application/json: {schema: {$ref: "#/components/schemas/InspirationDay"}}}}
  /inspirations/{id}:
    get:
      operationId: getInspiration
      tags: [inspirations]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: timeZone, in: query, schema: {type: string}}
      responses:
        "200": {description: Gated day, content: {application/json: {schema: {$ref: "#/components/schemas/InspirationDay"}}}}
  /inspirations/{id}/image:
    get:
      operationId: getInspirationImage
      tags: [inspirations]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: timeZone, in: query, schema: {type: string}}
        - {name: revision, in: query, schema: {type: integer, minimum: 1}}
      responses:
        "200": {description: Protected published image, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
  /admin/inspirations/week:
    get:
      operationId: getAdminInspirationWeek
      tags: [inspirations]
      parameters:
        - {name: date, in: query, schema: {type: string}}
      responses:
        "200": {description: Editorial week, content: {application/json: {schema: {$ref: "#/components/schemas/AdminInspirationWeek"}}}}
  /admin/inspirations/settings:
    put:
      operationId: updateInspirationSettings
      tags: [inspirations]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/InspirationSettings"}}}}
      responses:
        "200": {description: Updated labels, content: {application/json: {schema: {$ref: "#/components/schemas/InspirationSettings"}}}}
  /admin/inspirations/uploads:
    post:
      operationId: requestInspirationUpload
      tags: [inspirations]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/InspirationUploadBody"}}}}
      responses:
        "200": {description: Private upload, content: {application/json: {schema: {$ref: "#/components/schemas/InspirationUpload"}}}}
  /admin/inspirations/image:
    get:
      operationId: getAdminInspirationImage
      tags: [inspirations]
      parameters:
        - {name: objectPath, in: query, required: true, schema: {type: string}}
      responses:
        "200": {description: Admin-only preview, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
  /admin/inspirations:
    post:
      operationId: createAdminInspiration
      tags: [inspirations]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateAdminInspirationBody"}}}}
      responses:
        "200": {description: Draft, content: {application/json: {schema: {$ref: "#/components/schemas/AdminInspiration"}}}}
  /admin/inspirations/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getAdminInspiration
      tags: [inspirations]
      responses:
        "200": {description: Editorial record, content: {application/json: {schema: {$ref: "#/components/schemas/AdminInspiration"}}}}
    put:
      operationId: updateAdminInspiration
      tags: [inspirations]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/UpdateAdminInspirationBody"}}}}
      responses:
        "200": {description: Draft updated, content: {application/json: {schema: {$ref: "#/components/schemas/AdminInspiration"}}}}
    delete:
      operationId: deleteAdminInspiration
      tags: [inspirations]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/InspirationRevisionBody"}}}}
      responses:
        "200": {description: Deleted record, content: {application/json: {schema: {$ref: "#/components/schemas/AdminInspiration"}}}}
  /admin/inspirations/{id}/publish:
    post:
      operationId: publishAdminInspiration
      tags: [inspirations]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/InspirationRevisionBody"}}}}
      responses:
        "200": {description: Published snapshot, content: {application/json: {schema: {$ref: "#/components/schemas/AdminInspiration"}}}}
  /admin/inspirations/{id}/unpublish:
    post:
      operationId: unpublishAdminInspiration
      tags: [inspirations]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/InspirationRevisionBody"}}}}
      responses:
        "200": {description: Withdrawn, content: {application/json: {schema: {$ref: "#/components/schemas/AdminInspiration"}}}}
  /me/inspiration-favorites:
    get:
      operationId: getInspirationFavorites
      tags: [inspirations]
      parameters:
        - {name: timeZone, in: query, schema: {type: string}}
      responses:
        "200": {description: Owner favorites including tombstones, content: {application/json: {schema: {$ref: "#/components/schemas/InspirationFavorites"}}}}
  /me/inspiration-favorites/{inspirationId}:
    put:
      operationId: putInspirationFavorite
      tags: [inspirations]
      parameters:
        - {name: inspirationId, in: path, required: true, schema: {type: string}}
        - {name: timeZone, in: query, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PutInspirationFavoriteBody"}}}}
      responses:
        "200": {description: Owner favorite, content: {application/json: {schema: {$ref: "#/components/schemas/InspirationFavorite"}}}}
  /me/inspiration-notes:
    get:
      operationId: getInspirationNotes
      tags: [inspirations]
      parameters:
        - {name: inspirationId, in: query, schema: {type: string}}
      responses:
        "200": {description: Owner notes including tombstones, content: {application/json: {schema: {$ref: "#/components/schemas/InspirationNotes"}}}}
  /me/inspiration-notes/{id}:
    put:
      operationId: putInspirationNote
      tags: [inspirations]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: timeZone, in: query, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PutInspirationNoteBody"}}}}
      responses:
        "200": {description: Owner note, content: {application/json: {schema: {$ref: "#/components/schemas/InspirationNote"}}}}
  /quote-of-the-day:
    get:
      operationId: getQuoteOfTheDay
      tags: [quotes]
      parameters:
        - {name: timeZone, in: query, required: false, schema: {type: string, default: America/Santiago}}
      responses:
        "200":
          description: Frase global asignada para el día calendario de Chile
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QuoteOfTheDayResponse"}
  /streak-info:
    get:
      operationId: getStreakInfo
      tags: [greeting]
      summary: Texts shown on Sistema de rachas
      responses:
        "200":
          description: Current streak information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreakInfoSettings"
  /admin/streak-info:
    get:
      operationId: getAdminStreakInfo
      tags: [admin]
      summary: Read editable streak information
      responses:
        "200":
          description: Editable streak information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreakInfoSettings"
        "401": {description: Unauthorized}
        "403": {description: Forbidden}
    put:
      operationId: updateAdminStreakInfo
      tags: [admin]
      summary: Save all streak information texts atomically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreakInfoSettings"
      responses:
        "200":
          description: Saved streak information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreakInfoSettings"
        "400": {description: Invalid content}
        "401": {description: Unauthorized}
        "403": {description: Forbidden}
        "409": {description: Another editor updated this content}
  /greeting:
    get:
      operationId: getGreeting
      tags: [greeting]
      summary: Get the active global greeting
      responses:
        "200":
          description: Public greeting configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Greeting"
  /admin/greeting:
    get:
      operationId: getAdminGreeting
      tags: [admin]
      summary: Get the global greeting setting
      responses:
        "200":
          description: Editable greeting setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGreeting"
        "401": {description: Not authenticated}
        "403": {description: Admin role required}
    put:
      operationId: updateAdminGreeting
      tags: [admin]

openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: messages
    description: Anonymous community messages
  - name: users
    description: User profiles
  - name: friends
    description: Friendships and friend requests
  - name: notifications
    description: User notifications
  - name: dm
    description: Direct messages between friends
  - name: storage
    description: File upload and serving
  - name: push
    description: Mobile push notification tokens
  - name: mixes
    description: Community-shared "Mi Música" mixes
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /messages:
    get:
      operationId: getMessages
      tags: [messages]
      summary: Get anonymous messages
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: Paginated list of messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagesPage"
    post:
      operationId: createMessage
      tags: [messages]
      summary: Post an anonymous message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageBody"
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityMessage"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /messages/top:
    get:
      operationId: getTopMessage
      tags: [messages]
      summary: Get today's top message by likes
      responses:
        "200":
          description: Top message or null if none exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopMessageResponse"
  /mixes:
    get:
      operationId: getSharedMixes
      tags: [mixes]
      summary: List community-shared mixes (newest first)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: category
          in: query
          schema:
            type: string
            enum: [dormir, trabajar, motivarme]
      responses:
        "200":
          description: Paginated list of shared mixes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedMixesPage"
    post:
      operationId: shareMix
      tags: [mixes]
      summary: Share a mix to the community (requires account)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharedMixInput"
      responses:
        "201":
          description: Mix shared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedMix"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /mixes/{id}/like:
    post:
      operationId: toggleSharedMixLike
      tags: [mixes]
      summary: Toggle like on a shared mix (requires account)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated mix with like state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedMix"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /mixes/{id}:
    delete:
      operationId: unshareMix
      tags: [mixes]
      summary: Unshare a mix (author only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Unshared
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the author
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get the current user's profile (auto-creates on first call)
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update the current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/search:
    get:
      operationId: searchUsers
      tags: [users]
      summary: Search users by username or display name
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Matching users with friendship status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSearchResult"
  /friends:
    get:
      operationId: getFriends
      tags: [friends]
      summary: List accepted friends
      responses:
        "200":
          description: Friends list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"
  /friends/{userId}:
    delete:
      operationId: removeFriend
      tags: [friends]
      summary: Remove a friend (or cancel a pending request involving the user)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /friend-requests:
    get:
      operationId: getFriendRequests
      tags: [friends]
      summary: List incoming pending friend requests
      responses:
        "200":
          description: Incoming requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FriendRequest"
    post:
      operationId: sendFriendRequest
      tags: [friends]
      summary: Send a friend request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendRequestInput"
      responses:
        "201":
          description: Request sent (or accepted, if there was a matching incoming request)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequest"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Target user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already friends or request already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /friend-requests/{id}/accept:
    post:
      operationId: acceptFriendRequest
      tags: [friends]
      summary: Accept an incoming friend request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequest"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /friend-requests/{id}/decline:
    post:
      operationId: declineFriendRequest
      tags: [friends]
      summary: Decline an incoming friend request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Declined
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: List the current user's notifications (newest first)
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      tags: [notifications]
      summary: Number of unread notifications
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "204":
          description: Marked as read
  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/public-objects/{filePath}:
    get:
      tags: [storage]
      operationId: getPublicObject
      summary: Serve a public asset
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [storage]
      operationId: getStorageObject
      summary: Serve an uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /dm/conversations:
    get:
      operationId: getConversations
      tags: [dm]
      summary: List recent conversations with friends
      responses:
        "200":
          description: Conversations list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
  /dm/with/{userId}:
    get:
      operationId: getDirectMessages
      tags: [dm]
      summary: Get messages with a friend (newest first)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
        - name: before
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DirectMessage"
        "403":
          description: Not friends
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: sendDirectMessage
      tags: [dm]
      summary: Send a direct message to a friend
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendDirectMessageBody"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectMessage"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not friends
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dm/with/{userId}/read:
    post:
      operationId: markConversationRead
      tags: [dm]
      summary: Mark all messages from this friend as read
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Marked as read
  /dm/with/{userId}/typing:
    post:
      operationId: pingTyping
      tags: [dm]
      summary: Notify that the current user is typing
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Acknowledged
    get:
      operationId: getTypingStatus
      tags: [dm]
      summary: Check whether the friend is currently typing
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Typing status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypingStatus"
  /messages/{id}/like:
    post:
      operationId: likeMessage
      tags: [messages]
      summary: Like a message
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated like count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /push/register:
    post:
      tags: [push]
      operationId: registerPushToken
      summary: Register an Expo push token for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPushTokenBody"
      responses:
        "204":
          description: Registered
        "400":
          description: Invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /push/unregister:
    post:
      tags: [push]
      operationId: unregisterPushToken
      summary: Remove a push token (e.g. on logout)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnregisterPushTokenBody"
      responses:
        "204":
          description: Unregistered
        "400":
          description: Invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    RegisterPushTokenBody:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 500
        platform:
          type: string
          enum: [ios, android, web]
      required: [token, platform]
    UnregisterPushTokenBody:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 500
      required: [token]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CommunityMessage:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        likes:
          type: integer
      required: [id, content, createdAt, likes]
    MessagesPage:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/CommunityMessage"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
      required: [messages, total, page, pageSize]
    CreateMessageBody:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 300
      required: [content]
    TopMessageResponse:
      type: object
      properties:
        message:
          oneOf:
            - $ref: "#/components/schemas/CommunityMessage"
            - type: "null"
      required: [message]
    SharedMixSound:
      type: object
      properties:
        id:
          type: string
        volume:
          type: number
      required: [id, volume]
    SharedMix:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        image:
          type: ["string", "null"]
        category:
          type: string
          enum: [dormir, trabajar, motivarme]
        sounds:
          type: array
          items:
            $ref: "#/components/schemas/SharedMixSound"
        likes:
          type: integer
        likedByMe:
          type: boolean
        isMine:
          type: boolean
        author:
          $ref: "#/components/schemas/UserProfile"
        createdAt:
          type: string
          format: date-time
      required:
        [id, name, category, sounds, likes, likedByMe, isMine, author, createdAt]
    SharedMixesPage:
      type: object
      properties:
        mixes:
          type: array
          items:
            $ref: "#/components/schemas/SharedMix"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
      required: [mixes, total, page, pageSize]
    SharedMixInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        description:
          type: string
          maxLength: 120
        image:
          type: string
          maxLength: 60
        category:
          type: string
          enum: [dormir, trabajar, motivarme]
        sounds:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: "#/components/schemas/SharedMixSound"
      required: [name, category, sounds]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    UserProfile:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: ["string", "null"]
      required: [id, username, displayName]
    UserProfileUpdate:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 24
          pattern: "^[a-zA-Z0-9_]+$"
        displayName:
          type: string
          minLength: 1
          maxLength: 60
        avatarUrl:
          type: ["string", "null"]
    UserSearchResult:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: ["string", "null"]
        friendshipStatus:
          type: string
          enum: ["none", "pending_outgoing", "pending_incoming", "accepted", "self"]
      required: [id, username, displayName, friendshipStatus]
    FriendRequest:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          enum: ["pending", "accepted"]
        createdAt:
          type: string
          format: date-time
        requester:
          $ref: "#/components/schemas/UserProfile"
        addressee:
          $ref: "#/components/schemas/UserProfile"
      required: [id, status, createdAt, requester, addressee]
    FriendRequestInput:
      type: object
      properties:
        addresseeId:
          type: integer
      required: [addresseeId]
    Notification:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: ["friend_request", "friend_accepted", "dm", "group_message"]
        createdAt:
          type: string
          format: date-time
        readAt:
          type: ["string", "null"]
          format: date-time
        actor:
          $ref: "#/components/schemas/UserProfile"
      required: [id, type, createdAt, readAt, actor]
    DirectMessage:
      type: object
      properties:
        id:
          type: integer
        senderId:
          type: integer
        recipientId:
          type: integer
        body:
          type: ["string", "null"]
        sessionId:
          type: ["integer", "null"]
        attachmentUrl:
          type: ["string", "null"]
        attachmentType:
          type: ["string", "null"]
          enum: ["image", "audio", null]
        attachmentMeta:
          type: ["object", "null"]
          properties:
            mime:
              type: string
            durationMs:
              type: integer
            width:
              type: integer
            height:
              type: integer
            sizeBytes:
              type: integer
        readAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required: [id, senderId, recipientId, body, sessionId, attachmentUrl, attachmentType, attachmentMeta, readAt, createdAt]
    Conversation:
      type: object
      properties:
        friend:
          $ref: "#/components/schemas/UserProfile"
        lastMessage:
          oneOf:
            - $ref: "#/components/schemas/DirectMessage"
            - type: "null"
        unreadCount:
          type: integer
      required: [friend, lastMessage, unreadCount]
    SendDirectMessageBody:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
        sessionId:
          type: integer
        attachmentUrl:
          type: string
          minLength: 1
        attachmentType:
          type: string
          enum: ["image", "audio"]
        attachmentMeta:
          type: object
          properties:
            mime:
              type: string
            durationMs:
              type: integer
            width:
              type: integer
            height:
              type: integer
            sizeBytes:
              type: integer
    RequestUploadUrlBody:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    RequestUploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/RequestUploadUrlBody"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    TypingStatus:
      type: object
      properties:
        typing:
          type: boolean
      required: [typing]
    UnreadCount:
      type: object
      properties:
        count:
          type: integer
      required: [count]

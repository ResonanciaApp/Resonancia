<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 100">

  <!-- Body (fondo único) -->
  <rect width="130" height="100" rx="14" fill="#7040AC"/>

  <!-- ── Controls ─────────────────────────── -->

  <!-- Three knob buttons -->
  <circle cx="27" cy="32" r="7.5" fill="white"/>
  <circle cx="48" cy="32" r="7.5" fill="white"/>
  <circle cx="69" cy="32" r="7.5" fill="white"/>

  <!-- Colon separator -->
  <circle cx="83" cy="27" r="3" fill="white" opacity="0.8"/>
  <circle cx="83" cy="37" r="3" fill="white" opacity="0.8"/>

  <!-- Sliders verticales (tipo ecualizador) -->

  <!-- Slider izquierdo: track + manija baja -->
  <rect x="101" y="21" width="2.5" height="23" rx="1.25" fill="white" opacity="0.35"/>
  <rect x="95"  y="35" width="14"  height="5"  rx="2.5"  fill="white"/>

  <!-- Slider derecho: track + manija alta -->
  <rect x="116" y="21" width="2.5" height="23" rx="1.25" fill="white" opacity="0.35"/>
  <rect x="110" y="24" width="14"  height="5"  rx="2.5"  fill="white"/>

  <!-- ── Keyboard ──────────────────────────── -->
  <!-- Las teclas blancas se dibujan sobre el body.
       Los huecos entre ellas y las teclas negras muestran
       el violeta del cuerpo — sin strip extra. -->

  <!-- White keys (4 keys, 3 px gap between each) -->
  <rect x="6"  y="55" width="25" height="39" rx="3" fill="white"/>
  <rect x="34" y="55" width="25" height="39" rx="3" fill="white"/>
  <rect x="62" y="55" width="25" height="39" rx="3" fill="white"/>
  <rect x="90" y="55" width="34" height="39" rx="3" fill="white"/>

  <!-- Black keys (mismo violeta que el body → se funden naturalmente) -->
  <rect x="24" y="55" width="17" height="25" rx="2.5" fill="#7040AC"/>
  <rect x="52" y="55" width="17" height="25" rx="2.5" fill="#7040AC"/>
  <rect x="80" y="55" width="17" height="25" rx="2.5" fill="#7040AC"/>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <g fill="#3D8C40">

    <!-- ── Rama (branch) ─────────────────────────────── -->
    <path d="
      M 12,182
      C 32,168 60,154 88,144
      C 116,134 146,126 178,118
      L 180,126
      C 148,134 118,142 90,152
      C 62,162 34,176 14,190
      Z
    "/>

    <!-- Hoja izquierda -->
    <path d="
      M 50,164
      C 36,156 24,142 30,128
      C 38,140 50,156 50,164 Z
    "/>
    <!-- nervio central hoja izquierda -->
    <path d="M 50,164 C 42,150 34,136 30,128"
          stroke="#2E7032" stroke-width="1.2" fill="none" opacity="0.5"/>

    <!-- Hoja central-izquierda -->
    <path d="
      M 82,150
      C 68,140 58,124 66,112
      C 72,126 82,142 82,150 Z
    "/>

    <!-- Hoja derecha -->
    <path d="
      M 166,126
      C 178,114 186,98 178,88
      C 170,102 162,118 166,126 Z
    "/>

    <!-- ── Pájaro ──────────────────────────────────────
         Silueta única: desde la punta del pico,
         sentido horario por la cabeza y dorso,
         luego cola baja a la izquierda,
         y vuelta por el vientre.           -->
    <path d="
      M 50,74
      C 52,66 62,56 76,52
      C 84,48 94,44 104,44
      C 114,44 124,48 132,54
      C 142,60 150,72 152,86
      C 154,100 148,114 136,120
      C 124,126 108,128 94,124
      C 80,120 66,114 56,120
      C 48,126 44,132 46,140
      C 50,130 56,118 62,112
      C 58,104 52,96 50,86
      C 48,80 48,76 50,74
      Z
    "/>

    <!-- Patas (dos ramitas desde la base del cuerpo al palo) -->
    <path d="
      M 96,122 L 94,132 L 85,138 M 94,132 L 94,138 M 94,132 L 102,138
    " stroke="#3D8C40" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="
      M 110,118 L 108,128 L 100,134 M 108,128 L 108,134 M 108,128 L 116,134
    " stroke="#3D8C40" stroke-width="3" stroke-linecap="round" fill="none"/>

  </g>

  <!-- Ojo (blanco) -->
  <circle cx="68" cy="62" r="4.5" fill="white"/>
</svg>
